<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JS AQUA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="topbar">

    <div>
      <div class="brand-name">JS AQUA</div>
      <div class="brand-subtitle">Aquarium Catalogue</div>
    </div>

    <div class="header-actions">

      <button id="searchButton" class="icon-button">
        🔍
      </button>

    </div>

  </header>


  <!-- =========================
       SEARCH
  ========================== -->

  <section id="searchPanel" class="search-panel hidden">

    <input
      id="searchInput"
      type="search"
      placeholder="Search fish..."
    >

  </section>


  <!-- =========================
       CATEGORIES
  ========================== -->

  <nav id="categoryBar" class="category-bar">

    <button
      class="category-button active"
      data-category="all">
      All
    </button>

  </nav>


  <!-- =========================
       PRODUCTS
  ========================== -->

  <main>

    <div id="statusMessage" class="status-message">
      Loading catalogue...
    </div>

    <section
      id="catalogGrid"
      class="catalog-grid">
    </section>

  </main>


  <!-- =========================
       PRODUCT POPUP
  ========================== -->

  <div
    id="productModal"
    class="modal hidden">

    <div
      id="modalBackdrop"
      class="modal-backdrop">
    </div>


    <article class="product-modal">

      <button
        id="closeModal"
        class="close-button">
        ×
      </button>


      <div
        id="modalImages"
        class="modal-images">
      </div>


      <div class="modal-content">

        <div
          id="modalCategory"
          class="modal-category">
        </div>

        <h2 id="modalName"></h2>


        <div class="modal-meta">

          <span id="modalSize"></span>

          <span id="modalId"></span>

        </div>


        <div
          id="modalRate"
          class="modal-rate">
        </div>


        <div
          id="modalAvailability"
          class="modal-availability">
        </div>


        <p
          id="modalDetails"
          class="modal-details">
        </p>


      </div>

    </article>

  </div>


  <script src="app.js"></script>

</body>
</html>
