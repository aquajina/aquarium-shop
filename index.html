<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS AQUA</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="topbar">

    <div>
      <div class="brand-name">JS AQUA</div>
      <div class="brand-subtitle">Aquarium Catalogue</div>
    </div>

    <div class="header-actions">

      <button id="searchButton" class="icon-button" aria-label="Search">
        🔍
      </button>

    </div>

  </header>


  <!-- =========================
       SEARCH
  ========================== -->

  <section id="searchPanel" class="search-panel hidden">

    <input
      id="searchInput"
      type="search"
      placeholder="Search fish..."
    >

  </section>


  <!-- =========================
       CATEGORIES
  ========================== -->

  <nav id="categoryBar" class="category-bar">

    <button
      class="category-button active"
      data-category="all">
      All
    </button>

  </nav>


  <!-- =========================
       PRODUCTS
  ========================== -->

  <main>

    <div id="statusMessage" class="status-message">
      Loading catalogue...
    </div>

    <section
      id="catalogGrid"
      class="catalog-grid">
    </section>

  </main>


  <!-- =========================
       FLOATING SIDE BUTTONS
  ========================== -->

  <div class="side-buttons">

    <button
      id="sideCartButton"
      class="side-button cart-side"
      aria-label="Cart">

      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="20" r="1.5"/>
        <circle cx="18" cy="20" r="1.5"/>
        <path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L22 7H6"/>
      </svg>

      <span id="sideCartCount" class="side-cart-count">0</span>

    </button>

    <a
      id="sideWhatsappButton"
      class="side-button whatsapp-side"
      href="#"
      target="_blank"
      rel="noopener"
      aria-label="WhatsApp">

      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M20.5 3.5A11 11 0 0 0 3.6 17.3L2 22l4.8-1.6a11 11 0 0 0 16.5-9.5c0-2.9-1.1-5.7-2.8-7.4zM12 20.1c-1.7 0-3.3-.5-4.7-1.3l-.3-.2-3 .9.9-2.9-.2-.3a9 9 0 1 1 7.3 3.8zm5.4-6.8c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.5-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.1-.3 0-.5l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3z"/>
      </svg>

    </a>

  </div>


  <!-- =========================
       PRODUCT POPUP
  ========================== -->

  <div
    id="productModal"
    class="modal hidden">

    <div
      id="modalBackdrop"
      class="modal-backdrop">
    </div>

    <article class="product-modal">

      <button
        id="closeModal"
        class="close-button"
        aria-label="Close">
        ×
      </button>

      <div class="modal-gallery">

        <div
          id="modalImages"
          class="modal-images">
        </div>

        <button
          id="galleryPrev"
          class="gallery-arrow prev hidden"
          aria-label="Previous photo">
          ‹
        </button>

        <button
          id="galleryNext"
          class="gallery-arrow next hidden"
          aria-label="Next photo">
          ›
        </button>

        <div
          id="galleryDots"
          class="gallery-dots hidden">
        </div>

      </div>

      <div class="modal-content">

        <div
          id="modalCategory"
          class="modal-category">
        </div>

        <h2 id="modalName"></h2>

        <div class="modal-meta">

          <span id="modalSize"></span>

          <span id="modalId"></span>

        </div>

        <div
          id="modalRate"
          class="modal-rate">
        </div>

        <div
          id="modalAvailability"
          class="modal-availability">
        </div>

        <p
          id="modalDetails"
          class="modal-details">
        </p>

        <div class="modal-actions">

          <button
            id="addToCartButton"
            class="action-button cart-button">
            Add to Cart
          </button>

          <a
            id="whatsappButton"
            class="action-button whatsapp-button"
            target="_blank"
            rel="noopener">
            Order on WhatsApp
          </a>

        </div>

      </div>

    </article>

  </div>


  <!-- =========================
       CART DRAWER
  ========================== -->

  <div
    id="cartDrawer"
    class="cart-drawer hidden">

    <div
      id="cartBackdrop"
      class="cart-backdrop">
    </div>

    <aside class="cart-panel">

      <header class="cart-header">

        <h2>Your Cart</h2>

        <button
          id="closeCart"
          class="close-button cart-close"
          aria-label="Close cart">
          ×
        </button>

      </header>

      <div
        id="cartItems"
        class="cart-items">
      </div>

      <footer class="cart-footer">

        <div class="cart-total-row">

          <span>Total</span>

          <strong id="cartTotal">—</strong>

        </div>

        <a
          id="cartWhatsappButton"
          class="action-button whatsapp-button"
          target="_blank"
          rel="noopener">
          Send Cart via WhatsApp
        </a>

      </footer>

    </aside>

  </div>


  <script src="app.js"></script>

</body>
</html>
