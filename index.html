<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">

  <title>JS AQUA | Aquarium Fish</title>
  <meta name="description" content="Explore aquarium fish and aquatic life from JS AQUA.">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">
    <a class="brand" href="./" aria-label="JS AQUA home">
      <span class="brand-name">JS AQUA</span>
      <span class="brand-subtitle">Aquarium Fish & Aquatic Life</span>
    </a>

    <div class="header-actions">
      <button id="searchButton" class="header-button"
              type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="m16 16 5 5"></path>
        </svg>
      </button>

      <button id="headerCartButton" class="header-button cart-icon-button"
              type="button" aria-label="Open shopping cart">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.5L22 8H6"></path>
          <circle cx="10" cy="20" r="1"></circle>
          <circle cx="18" cy="20" r="1"></circle>
        </svg>
        <span id="headerCartCount" class="cart-count hidden">0</span>
      </button>
    </div>
  </header>

  <!-- SEARCH -->
  <section id="searchPanel" class="search-panel hidden">
    <input id="searchInput" type="search"
           placeholder="Search fish, shrimp, category..."
           autocomplete="off">
  </section>

  <!-- CATEGORY FILTERS -->
  <nav id="categoryBar" class="category-bar" aria-label="Product categories">
  </nav>

  <!-- CATALOGUE -->
  <main>
    <div id="statusMessage" class="status-message">
      Loading catalogue...
    </div>

    <section id="catalogGrid" class="catalog-grid"
             aria-label="Aquarium catalogue">
    </section>
  </main>

  <!-- PRODUCT POPUP -->
  <section id="productModal" class="modal hidden"
           role="dialog" aria-modal="true"
           aria-labelledby="modalName">

    <div id="modalBackdrop" class="modal-backdrop"></div>

    <article class="product-modal">

      <button id="closeModal" class="close-button"
              type="button" aria-label="Close product">
        &times;
      </button>

      <!-- IMAGE GALLERY AT THE TOP -->
      <div class="modal-gallery">
        <div id="modalImages" class="modal-images"></div>

        <button id="galleryPrev" class="gallery-arrow prev hidden"
                type="button" aria-label="Previous image">
          &#10094;
        </button>

        <button id="galleryNext" class="gallery-arrow next hidden"
                type="button" aria-label="Next image">
          &#10095;
        </button>

        <div id="galleryDots" class="gallery-dots hidden"></div>
      </div>

      <!-- PRODUCT INFORMATION UNDER THE IMAGE -->
      <div class="modal-content">
        <div id="modalCategory" class="modal-category"></div>

        <h2 id="modalName"></h2>

        <div class="modal-meta">
          <span id="modalId"></span>
          <span id="modalSize"></span>
        </div>

        <div id="modalRate" class="modal-rate"></div>
        <div id="modalAvailability" class="modal-availability"></div>

        <div class="modal-actions">
          <a id="whatsappButton" class="action-button whatsapp-button"
             href="#" target="_blank" rel="noopener">
            WhatsApp to Order
          </a>

          <button id="addToCartButton"
                  class="action-button cart-button"
                  type="button">
            Add to Cart
          </button>
        </div>

        <div class="details-heading">Details</div>
        <div id="modalDetails" class="modal-details"></div>
      </div>

    </article>
  </section>

  <!-- SHOPPING CART DRAWER -->
  <section id="cartDrawer" class="cart-drawer hidden"
           role="dialog" aria-modal="true"
           aria-labelledby="cartTitle">

    <div id="cartBackdrop" class="cart-backdrop"></div>

    <aside class="cart-panel">
      <header class="cart-header">
        <h2 id="cartTitle">Your Cart</h2>

        <button id="closeCart" class="header-button cart-close"
                type="button" aria-label="Close cart">
          &times;
        </button>
      </header>

      <div id="cartItems" class="cart-items"></div>

      <footer class="cart-footer">
        <div class="cart-total-row">
          <span>Estimated total</span>
          <strong id="cartTotal">—</strong>
        </div>

        <p class="cart-note">
          Final availability and delivery will be confirmed by JS AQUA.
        </p>

        <a id="cartWhatsappButton"
           class="action-button whatsapp-button hidden"
           href="#" target="_blank" rel="noopener">
          Send Order on WhatsApp
        </a>
      </footer>
    </aside>
  </section>

  <script src="app.js" defer></script>
</body>
</html>
