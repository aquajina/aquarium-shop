<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test</title>
</head>
<body>

<h1>Aquarium Shop — Test</h1>
<div id="status">Loading…</div>
<pre id="output"></pre>

<script>
fetch('catalog.json')
  .then(r => {
    document.getElementById('status').textContent = 'HTTP ' + r.status;
    return r.text();
  })
  .then(text => {
    document.getElementById('output').textContent = text.slice(0, 5000);
  })
  .catch(err => {
    document.getElementById('status').textContent = 'ERROR: ' + err.message;
  });
</script>

</body>
</html>
