<script>
fetch('catalog.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('status').textContent = 'Loaded ' + data.length + ' items';
    const feed = document.getElementById('feed');
    data.forEach(item => {
      const div = document.createElement('div');
      div.style.cssText = 'border:1px solid #ccc; margin:10px; padding:10px; max-width:300px;';

      const img = document.createElement('img');
      img.src = (item.images && item.images[0]) || '';
      img.style.cssText = 'width:100%; height:200px; object-fit:cover; display:block;';

      const info = document.createElement('div');
      info.style.cssText = 'margin-top:8px; font-size:14px;';
      info.textContent = item.id + ' — ' + item.name + ' — ' + item.rate + ' — ' + item.avail;

      div.appendChild(img);
      div.appendChild(info);
      feed.appendChild(div);
    });
  })
  .catch(err => {
    document.getElementById('status').textContent = 'ERROR: ' + err.message;
  });
</script>
